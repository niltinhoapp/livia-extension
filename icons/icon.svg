<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="liviaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#3A7BD5" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="128" height="128" rx="28" fill="#0B0F19" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#liviaGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Lívia Sparkle / AI Star -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- 4-point star -->
    <path d="M 0,-40 Q 0,0 -40,0 Q 0,0 0,40 Q 0,0 40,0 Q 0,0 0,-40 Z" fill="url(#liviaGrad)" />
    <!-- Secondary sparkle -->
    <path d="M 22,-22 Q 22,-10 10,-10 Q 22,-10 22,2 Q 22,-10 34,-10 Q 22,-10 22,-22 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
